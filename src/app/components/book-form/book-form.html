<div class="container" style="max-width: 600px;">
  <h2 class="mb-4">
    <i class="fa-solid fa-book me-2"></i>
    {{ bookId ? 'Redigera bok' : 'Lägg till ny bok' }}
  </h2>

  @if (errorMessage) {
  <div class="alert alert-danger">{{ errorMessage }}</div>
  }

  <div class="card shadow-sm">
    <div class="card-body">
      <form [formGroup]="bookForm" (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label for="title" class="form-label">Titel</label>
          <input id="title" type="text" class="form-control" formControlName="title">
        </div>

        <div class="mb-3">
          <label for="author" class="form-label">Författare</label>
          <input id="author" type="text" class="form-control" formControlName="author">
        </div>

        <div class="mb-3">
          <label for="publishedDate" class="form-label">Publiceringsdatum</label>
          <input id="publishedDate" type="date" class="form-control" formControlName="publishedDate">
        </div>

        <button type="submit" class="btn btn-primary" [disabled]="bookForm.invalid">
          <i class="fa-solid fa-check me-1"></i>
          {{ bookId ? 'Spara ändringar' : 'Lägg till' }}
        </button>

        <a routerLink="/books" class="btn btn-secondary ms-2">Avbryt</a>
      </form>
    </div>
  </div>
</div>
