<div class="auth-wrapper animate-fade-in">
  <!-- Subtle ambient glow circle behind the card -->
  <div class="auth-glow"></div>

  <div class="card auth-card shadow-xl mx-auto">
    <div class="card-accent-bar"></div>
    <div class="card-body p-4 p-sm-5">
      <!-- Header with Logo -->
      <div class="text-center mb-4">
        <div class="auth-brand-icon mx-auto mb-3">
          <i class="fa-solid fa-book-open"></i>
        </div>
        <h2 class="auth-title mb-1">Välkommen tillbaka</h2>
        <p class="text-muted small">Logga in för att komma åt ditt bibliotek och dina citat</p>
      </div>

      <!-- Error alert -->
      @if (errorMessage) {
      <div class="alert alert-danger mb-4 py-2">
        <i class="fa-solid fa-circle-exclamation me-2"></i>
        <span>{{ errorMessage }}</span>
      </div>
      }

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
        <!-- Username -->
        <div class="mb-3">
          <label for="username" class="form-label">Användarnamn</label>
          <div class="input-group modern-input-group">
            <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
            <input
              id="username"
              type="text"
              class="form-control"
              placeholder="Ditt användarnamn"
              formControlName="username"
              autocomplete="username"
            >
          </div>
        </div>

        <!-- Password -->
        <div class="mb-4">
          <label for="password" class="form-label">Lösenord</label>
          <div class="input-group modern-input-group">
            <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
            <input
              id="password"
              type="password"
              class="form-control"
              placeholder="••••••••"
              formControlName="password"
              autocomplete="current-password"
            >
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary w-100 py-2 fs-6 shadow-sm" [disabled]="loginForm.invalid">
          <span>Logga in</span>
          <i class="fa-solid fa-arrow-right ms-1"></i>
        </button>
      </form>

      <!-- Footer navigation -->
      <div class="text-center mt-4 pt-3 border-top border-light-subtle">
        <p class="text-muted small mb-0">
          Inget konto än?
          <a routerLink="/register" class="auth-link ms-1 fw-bold">Skapa ett konto här</a>
        </p>
      </div>
    </div>
  </div>
</div>
