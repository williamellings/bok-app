<div class="container">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="fa-solid fa-book me-2"></i>Böcker</h2>
    <a routerLink="/books/new" class="btn btn-primary">
      <i class="fa-solid fa-plus me-1"></i>Lägg till ny bok
    </a>
  </div>

  @if (errorMessage) {
  <div class="alert alert-danger">{{ errorMessage }}</div>
  }

  <div class="card shadow-sm">
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-hover align-middle">
          <thead>
            <tr>
              <th>Titel</th>
              <th>Författare</th>
              <th>Publicerad</th>
              <th class="text-end">Åtgärder</th>
            </tr>
          </thead>
          <tbody>
            @for (book of books; track book.id) {
            <tr>
              <td>{{ book.title }}</td>
              <td>{{ book.author }}</td>
              <td>{{ book.publishedDate | date:'yyyy-MM-dd' }}</td>
              <td class="text-end">
                <a [routerLink]="['/books', book.id, 'edit']" class="btn btn-sm btn-outline-primary me-1">
                  <i class="fa-solid fa-pen"></i> Redigera
                </a>
                <button class="btn btn-sm btn-outline-danger" (click)="deleteBook(book.id)">
                  <i class="fa-solid fa-trash"></i> Radera
                </button>
              </td>
            </tr>
            }
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
