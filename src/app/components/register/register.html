<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
  <div class="card shadow-sm" style="width: 100%; max-width: 400px;">
    <div class="card-body p-4">
      <h2 class="card-title text-center mb-4">
        <i class="fa-solid fa-user-plus me-2"></i>Registrera dig
      </h2>

      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label for="username" class="form-label">Användarnamn</label>
          <input id="username" type="text" class="form-control" formControlName="username">
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Lösenord</label>
          <input id="password" type="password" class="form-control" formControlName="password">
          <div class="form-text">Minst 6 tecken.</div>
        </div>

        @if (errorMessage) {
        <div class="alert alert-danger py-2">{{ errorMessage }}</div>
        }

        @if (successMessage) {
        <div class="alert alert-success py-2">{{ successMessage }}</div>
        }

        <button type="submit" class="btn btn-primary w-100" [disabled]="registerForm.invalid">
          Registrera
        </button>
      </form>

      <p class="text-center mt-3 mb-0">
        Har du redan ett konto? <a routerLink="/login">Logga in här</a>
      </p>
    </div>
  </div>
</div>
