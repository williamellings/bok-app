<nav class="navbar navbar-expand-lg glass-nav sticky-top">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center gap-2" routerLink="/books">
      <div class="brand-icon">
        <i class="fa-solid fa-book-open"></i>
      </div>
      <span class="brand-text">Bok<span class="brand-accent">App</span></span>
    </a>

    <button class="navbar-toggler custom-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <div class="navbar-nav me-auto gap-1 my-2 my-lg-0">
        @if (authService.isAuthenticated()) {
        <a class="nav-link custom-nav-link" routerLink="/books" routerLinkActive="active" [routerLinkActiveOptions]="{exact: false}">
          <i class="fa-solid fa-book"></i>
          <span>Böcker</span>
        </a>
        <a class="nav-link custom-nav-link" routerLink="/quotes" routerLinkActive="active">
          <i class="fa-solid fa-quote-left"></i>
          <span>Mina citat</span>
        </a>
        } @else {
        <a class="nav-link custom-nav-link" routerLink="/login" routerLinkActive="active">
          <i class="fa-solid fa-right-to-bracket"></i>
          <span>Logga in</span>
        </a>
        <a class="nav-link custom-nav-link" routerLink="/register" routerLinkActive="active">
          <i class="fa-solid fa-user-plus"></i>
          <span>Registrera</span>
        </a>
        }
      </div>

      <div class="d-flex align-items-center gap-2 pt-2 pt-lg-0">
        @if (authService.isAuthenticated()) {
        <button class="btn btn-nav-action btn-logout" (click)="logout()" title="Logga ut">
          <i class="fa-solid fa-arrow-right-from-bracket"></i>
          <span class="d-none d-sm-inline">Logga ut</span>
        </button>
        }

        <button class="btn btn-nav-action btn-theme" (click)="themeService.toggleTheme()" [title]="themeService.isDarkMode() ? 'Växla till ljust läge' : 'Växla till mörkt läge'">
          @if (themeService.isDarkMode()) {
          <i class="fa-solid fa-sun text-warning theme-icon"></i>
          } @else {
          <i class="fa-solid fa-moon text-primary theme-icon"></i>
          }
        </button>
      </div>
    </div>
  </div>
</nav>

<main class="main-content py-4">
  <router-outlet />
</main>
